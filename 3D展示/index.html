<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RE-ENERGY · 产品族 3D 滚动叙事 | Re-Pulse · Re-Bridge</title>
<meta name="description" content="让每一度电持续创造价值 —— Re-Pulse 移动式储能电芯主动活化巡检工作站 / Re-Bridge 磁吸式多协议边缘网关，沉浸式 3D 滚动叙事。">
<link rel="stylesheet" href="css/show.css">
</head>
<body>

<!-- ============================ 3D 舞台（固定全屏） ============================ -->
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
</div>

<!-- ============================ 顶部 HUD ============================ -->
<header id="hud-top">
  <div class="brand">
    <span class="mark">R</span>
    <span class="txt"><b>RE-ENERGY</b><i>SCROLL SHOWREEL</i></span>
  </div>

  <nav id="switch" aria-label="产品切换">
    <button type="button" data-p="pulse" class="on">RE-PULSE</button>
    <button type="button" data-p="bridge">RE-BRIDGE</button>
  </nav>

  <a id="studio-link" href="studio.html">工程模式<i>↗</i></a>
</header>

<!-- ============================ 右侧：进度轨道 + 章节导航 ============================ -->
<aside id="rail">
  <div id="rail-track">
    <div id="rail-fill"></div>
    <div id="rail-dots"></div>
  </div>
  <div id="chap-idx">01<span>/ 10</span></div>
</aside>

<!-- ============================ 左下：机位读数 ============================ -->
<div id="hud-cam">
  <span>AZ <b id="cam-az">000</b>°</span>
  <span>EL <b id="cam-el">00</b>°</span>
  <span>DIST <b id="cam-d">0.00</b>m</span>
  <span>FOV <b id="cam-f">38</b>°</span>
</div>

<!-- ============================ 章节文案（JS 生成） ============================ -->
<div id="chapters"></div>

<!-- ============================ 滚动提示 / 滚动轨道 ============================ -->
<div id="scroll-hint"><span>SCROLL</span><i></i></div>
<div id="track"></div>

<div id="loading"><span></span>正在构建 3D 模型…</div>

<script>
/* 出错时直接把信息显示到载入层，便于排查（也方便离线双击调试） */
window.__err = [];
window.addEventListener('error', function (e) {
  window.__err.push((e.message || 'error') + '  @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0));
  var el = document.getElementById('loading');
  if (el) {
    el.style.display = 'grid';
    el.innerHTML = '<pre style="max-width:80vw;white-space:pre-wrap;font:12px/1.7 Consolas,monospace;color:#ff9b8a;text-align:left">'
      + window.__err.join('\n') + '</pre>';
  }
});
</script>

<script src="js/three.min.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/config.js"></script>
<script src="js/models/repulse.js"></script>
<script src="js/models/rebridge.js"></script>
<script src="js/core/studio.js"></script>
<script src="js/core/labels.js"></script>
<script src="js/show.js"></script>
</body>
</html>
